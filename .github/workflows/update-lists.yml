name: Update official lists

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Deploy key with write access; the main-branch ruleset lets deploy keys bypass the PR rule.
          ssh-key: ${{ secrets.NIGHTLY_DEPLOY_KEY }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build lists
        id: build
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/build_official_lists.py

      - name: Smoke check
        id: smoke
        run: python scripts/smoke_lists.py

      - name: Build OpenSanctions index
        id: osbuild
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/build_opensanctions.py

      - name: Upload OpenSanctions index
        if: steps.osbuild.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Nightly data" --notes "Compact OpenSanctions index read by api/search.js; replaced every night. Data: OpenSanctions (opensanctions.org), CC BY-NC 4.0." --latest=false
          gh release upload data-latest build/opensanctions.json.gz --clobber

      - name: Commit changes
        if: steps.smoke.outcome == 'success'
        run: |
          git config user.name "undercurrent-nightly"
          git config user.email "undercurrent-nightly@users.noreply.github.com"
          git add data/lists data/opensanctions-meta.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: nightly lists $(date -u +%F)"
            git push
          fi

      - name: Open or update the failure issue
        if: steps.build.outcome == 'failure' || steps.osbuild.outcome == 'failure' || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(python -c "import json;m=json.load(open('data/lists/meta.json'))['lists'];f=[k for k,v in m.items() if v['status']!='fresh']
          try:
            o=json.load(open('data/opensanctions-meta.json'))
            f+=['opensanctions'] if o['status']!='fresh' else []
          except Exception: f.append('opensanctions')
          print(', '.join(f) or 'smoke check')" || echo "build crashed")
          title="Nightly lists: ${failed} failed $(date -u +%F)"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The site keeps serving the previous copy. Details in data/lists/meta.json and data/opensanctions-meta.json."
          existing=$(gh issue list --state open --search "Nightly lists in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$title. $body"
          else
            gh issue create --title "$title" --body "$body"
          fi
