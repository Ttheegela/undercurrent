name: Update official lists

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  # Downloads and parses untrusted outside data. Read-only token, no secrets.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      build: ${{ steps.build.outcome }}
      smoke: ${{ steps.smoke.outcome }}
      os: ${{ steps.osbuild.outcome }}
      cx: ${{ steps.cxbuild.outcome }}
      lob: ${{ steps.lobbuild.outcome }}
      chips: ${{ steps.chipsbuild.outcome }}
      graphs: ${{ steps.graphsbuild.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build lists
        id: build
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/build_official_lists.py

      - name: Smoke check
        id: smoke
        run: python scripts/smoke_lists.py

      - name: Build OpenSanctions index
        id: osbuild
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/build_opensanctions.py

      - name: Build connections
        id: cxbuild
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/build_connections.py

      - name: Build lobbying
        id: lobbuild
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/build_lobbying.py

      - name: Build chips
        id: chipsbuild
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/build_chips.py

      # Needs build/raw/{us,uk}.csv, data/lists/, data/lobbying-meta.json and build/lobbying.json.gz from the steps above,
      # and fetches two OpenSanctions CSVs. Exits 1 whenever it kept yesterday's fleet; data/live-graphs-meta.json says why.
      - name: Build live graphs
        id: graphsbuild
        timeout-minutes: 20
        continue-on-error: true
        run: python scripts/build_live_graphs.py

      # The paths the publish job commits, plus the release assets, staged in one
      # folder so the artifact always keeps repo-relative paths.
      - name: Collect outputs
        if: ${{ !cancelled() }}
        run: |
          out="$RUNNER_TEMP/nightly"
          mkdir -p "$out"
          for p in data/lists data/opensanctions-meta.json data/connections-meta.json data/lobbying-meta.json stories/chips-into-russia/data/routes.json stories/chips-into-russia/data/coverage.json stories/chips-into-russia/data/listing_lag.json stories/chips-into-russia/data/summary.json stories/chips-into-russia/data/chips-meta.json stories/shadow-fleet/network/fleet-data.json stories/shadow-fleet/network/nodes.json stories/shadow-fleet/network/edges.json stories/who-lobbies/influence-network/kg.json data/changes/changes.json data/site-stats.json data/live-graphs-meta.json build/*.json.gz; do
            if [ -e "$p" ]; then cp -R --parents "$p" "$out/"; fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: nightly-data
          path: ${{ runner.temp }}/nightly
          retention-days: 3
          if-no-files-found: error

  # Holds the deploy key. Runs no project code and parses no downloaded data.
  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nightly
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Deploy key with write access; the main-branch ruleset lets deploy keys bypass the PR rule.
          ssh-key: ${{ secrets.NIGHTLY_DEPLOY_KEY }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: dl
        with:
          name: nightly-data
          path: ${{ runner.temp }}/nightly

      # Copy only the expected paths; refuse dotfiles, symlinks and anything else that isn't a plain file or folder.
      - name: Put data files in place
        run: |
          src="$RUNNER_TEMP/nightly"
          odd=$(find "$src" -mindepth 1 \( -name '.*' -o \( ! -type f ! -type d \) \))
          if [ -n "$odd" ]; then echo "::error::Unexpected entries in artifact: $odd"; exit 1; fi
          if [ -d "$src/data/lists" ]; then rm -rf data/lists && cp -R "$src/data/lists" data/lists; fi
          for p in data/opensanctions-meta.json data/connections-meta.json data/lobbying-meta.json stories/chips-into-russia/data/routes.json stories/chips-into-russia/data/coverage.json stories/chips-into-russia/data/listing_lag.json stories/chips-into-russia/data/summary.json stories/chips-into-russia/data/chips-meta.json stories/shadow-fleet/network/fleet-data.json stories/shadow-fleet/network/nodes.json stories/shadow-fleet/network/edges.json stories/who-lobbies/influence-network/kg.json data/changes/changes.json data/site-stats.json data/live-graphs-meta.json; do
            if [ -f "$src/$p" ]; then cp "$src/$p" "$p"; fi
          done

      - name: Upload OpenSanctions index
        id: osupload
        continue-on-error: true
        if: needs.build.outputs.os == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Nightly data" --notes "Compact OpenSanctions index read by api/search.js; replaced every night. Data: OpenSanctions (opensanctions.org), CC BY-NC 4.0." --latest=false
          gh release upload data-latest "$RUNNER_TEMP/nightly/build/opensanctions.json.gz" --clobber

      - name: Upload connections
        id: cxupload
        if: needs.build.outputs.cx == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload data-latest "$RUNNER_TEMP/nightly/build/connections.json.gz" --clobber

      - name: Upload lobbying
        id: lobupload
        if: needs.build.outputs.lob == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload data-latest "$RUNNER_TEMP/nightly/build/lobbying.json.gz" --clobber

      # The smoke check is a quality gate, not a security boundary; the staged-path allowlist below is.
      - name: Commit changes
        id: commit
        if: needs.build.outputs.smoke == 'success'
        run: |
          git config user.name "undercurrent-nightly"
          git config user.email "undercurrent-nightly@users.noreply.github.com"
          git add data/lists data/opensanctions-meta.json data/connections-meta.json data/lobbying-meta.json stories/chips-into-russia/data/routes.json stories/chips-into-russia/data/coverage.json stories/chips-into-russia/data/listing_lag.json stories/chips-into-russia/data/summary.json stories/chips-into-russia/data/chips-meta.json stories/shadow-fleet/network/fleet-data.json stories/shadow-fleet/network/nodes.json stories/shadow-fleet/network/edges.json stories/who-lobbies/influence-network/kg.json data/changes/changes.json data/site-stats.json data/live-graphs-meta.json
          bad=$(git diff --cached --raw --no-renames | awk '{ if (($2 != "100644" && $2 != "000000") || $6 !~ /^(data\/lists\/[a-z]+\.json|data\/[a-z-]+-meta\.json|data\/site-stats\.json|data\/changes\/changes\.json|stories\/chips-into-russia\/data\/[a-z_-]+\.json|stories\/shadow-fleet\/network\/(fleet-data|nodes|edges)\.json|stories\/who-lobbies\/influence-network\/kg\.json)$/) print $6 }')
          if [ -n "$bad" ]; then echo "::error::Unexpected staged paths: $bad"; exit 1; fi
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: nightly lists $(date -u +%F)"
            # main may have moved while the build ran (a merge or another run): replay this data commit on top.
            for attempt in 1 2 3; do
              if git pull --rebase --no-autostash origin main && git push; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 10
            done
          fi

      - name: Open or update the failure issue
        if: needs.build.result != 'success' || needs.build.outputs.build == 'failure' || needs.build.outputs.os == 'failure' || steps.osupload.outcome == 'failure' || needs.build.outputs.cx == 'failure' || steps.cxupload.outcome == 'failure' || needs.build.outputs.lob == 'failure' || steps.lobupload.outcome == 'failure' || needs.build.outputs.chips == 'failure' || needs.build.outputs.graphs == 'failure' || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OS_UPLOAD: ${{ steps.osupload.outcome }}
          CX_BUILD: ${{ needs.build.outputs.cx }}
          CX_UPLOAD: ${{ steps.cxupload.outcome }}
          LOB_BUILD: ${{ needs.build.outputs.lob }}
          LOB_UPLOAD: ${{ steps.lobupload.outcome }}
          CHIPS_BUILD: ${{ needs.build.outputs.chips }}
          GRAPHS_BUILD: ${{ needs.build.outputs.graphs }}
          DL: ${{ steps.dl.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          up=""
          [ "$OS_UPLOAD" = "failure" ] && up="${up}, opensanctions upload"
          [ "$CX_BUILD" = "failure" ] && up="${up}, connections"
          [ "$CX_UPLOAD" = "failure" ] && up="${up}, connections upload"
          [ "$LOB_BUILD" = "failure" ] && up="${up}, lobbying"
          [ "$LOB_UPLOAD" = "failure" ] && up="${up}, lobbying upload"
          if [ "$CHIPS_BUILD" = "failure" ]; then
            src=$(jq -r '{"routes":"UN Comtrade/Eurostat","coverage":"UN Comtrade","listing_lag":"OFAC"} as $n | [.outputs | to_entries[] | select(.value.status != "fresh") | ($n[.key] // error("unknown output"))] | unique | join(" + ")' stories/chips-into-russia/data/chips-meta.json 2>/dev/null || echo "build crashed")
            up="${up}, chips (${src:-build crashed})"
          fi
          note=""
          if [ "$GRAPHS_BUILD" = "failure" ]; then
            up="${up}, live graphs"
            # The build's own note on why it kept yesterday's graphs. It can echo a download, so it is untrusted: read with jq,
            # never evaluated, only tonight's note, control characters and backticks dropped, 500 characters, inline code.
            err=$(jq -r --arg d "$(date -u +%F)" 'select(.checked_at[0:10] == $d) | .error | select(type == "string") | gsub("[\\p{Cc}\u0060]"; " ") | .[0:500]' "$RUNNER_TEMP/nightly/data/live-graphs-meta.json" 2>/dev/null || true)
            if [ -n "$err" ]; then note=$(printf ' Live graphs said: `%s`.' "$err"); fi
          fi
          failed=$(jq -r '[.lists | to_entries[] | select(.value.status != "fresh") | .key] | join(", ")' data/lists/meta.json) || failed="build crashed"
          if [ "$failed" != "build crashed" ] && [ "$(jq -r '.status' data/opensanctions-meta.json 2>/dev/null)" != "fresh" ]; then
            failed="${failed:+${failed}, }opensanctions"
          fi
          what="${failed}${up}"
          what="${what#, }"
          [ "$COMMIT" = "failure" ] && what="${what:+${what}, }commit/push to main"
          [ "$DL" = "failure" ] && what="artifact missing"
          title="Nightly lists: ${what:-smoke check} failed $(date -u +%F)"
          body="Run: ${RUN_URL}. The site keeps serving the previous copy. Details in data/lists/meta.json, data/opensanctions-meta.json, data/connections-meta.json, data/lobbying-meta.json, data/live-graphs-meta.json and stories/chips-into-russia/data/chips-meta.json.${note}"
          existing=$(gh issue list --state open --search "Nightly lists in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$title. $body"
          else
            gh issue create --title "$title" --body "$body"
          fi
